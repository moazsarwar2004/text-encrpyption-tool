<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Encryption Tool</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="card">
    <h1>Text Encryption Tool</h1>
    <p class="intro">Enter text, select a method, and encrypt or decrypt it.</p>
    <label for="input">Input text</label>
    <textarea id="input" rows="5" placeholder="Type your message here"></textarea>
    <label for="method">Encryption method</label>
    <select id="method">
      <option value="">Select a method</option>
      <option value="caesar">Caesar Cipher</option>
      <option value="vigenere">Vigenère Cipher</option>
      <option value="aes">AES-GCM</option>
    </select>
    <div id="keyWrap" hidden>
      <label for="key" id="keyLabel">Key</label>
      <input id="key" type="text" autocomplete="off">
      <p id="keyHint" class="hint"></p>
    </div>
    <div class="actions">
      <button id="encrypt" type="button">Encrypt</button>
      <button id="decrypt" type="button" class="secondary">Decrypt</button>
    </div>
    <p id="error" role="alert" aria-live="polite"></p>
    <label for="output">Result</label>
    <textarea id="output" rows="5" readonly placeholder="Your result appears here"></textarea>
    <button id="copy" type="button" class="copy">Copy result</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
